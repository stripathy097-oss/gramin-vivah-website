<script>
// 1. Aapka Vendor Data
const vendors = [
    { id: 1, name: 'Shri Ram Tent House', village: 'Rampur', cat: 'tent', rating: 4.8 },
    { id: 2, name: 'Sonu Band Party', village: 'Sitapur', cat: 'band', rating: 4.6 },
    { id: 3, name: 'Mama Ji Ka Dhaba', village: 'Rampur', cat: 'catering', rating: 4.9 }
];

// 2. Search Function
function doSearch() {
    const term = document.getElementById('searchInput').value.toLowerCase().trim();
    const selectedCat = document.getElementById('searchCat').value;
    
    // Data filter karne ka logic
    const filtered = vendors.filter(v => {
        const matchesTerm = v.village.toLowerCase().includes(term) || v.name.toLowerCase().includes(term);
        const matchesCat = selectedCat === "" || v.cat === selectedCat;
        return matchesTerm && matchesCat;
    });

    console.log("Filtered Results:", filtered);
    renderVendors(filtered); // Yeh function cards ko update karega
}

// 3. Quick Village Select
function fillSearch(villageName) {
    document.getElementById('searchInput').value = villageName;
    doSearch();
}

// 4. Input par real-time search
document.getElementById('searchInput').addEventListener('input', doSearch);
</script>
